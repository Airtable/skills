name: Package Skills

on:
    push:
        branches: [main]

concurrency:
    group: package-skills-${{ github.ref }}
    cancel-in-progress: false

jobs:
    zip-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Set release tag (date-based)
              id: tag
              run: echo "TAG=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

            - name: Create zip package
              run: |
                  SKILLS_FOLDER="skills"
                  zip -r airtable-skills.zip "$SKILLS_FOLDER" --include '*.md'

            - name: Delete existing release for today (if re-running)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.tag.outputs.TAG }}
              run: |
                  gh release delete "$TAG" --yes 2>/dev/null || true
                  git push --delete origin "$TAG" 2>/dev/null || true

            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.tag.outputs.TAG }}
                  SHA: ${{ github.sha }}
              run: |
                  gh release create "$TAG" airtable-skills.zip \
                      --title "Airtable Skills — $TAG" \
                      --notes "Automated skills package generated on $TAG. Triggered by commit $SHA." \
                      --target "$SHA" \
                      --latest
